<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c07a45"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>

  <!-- ===== Row 1: student and its rollout ===== -->
  <rect x="34" y="40" width="226" height="84" rx="12" fill="#fbe9da" stroke="#c07a45" stroke-width="2"/>
  <text x="147" y="70" font-size="17" font-weight="700" fill="#8a4f22" text-anchor="middle">Few-Step Student</text>
  <text x="147" y="90" font-size="12.5" fill="#a0623a" text-anchor="middle">4 sampling steps</text>
  <g fill="#c07a45">
    <rect x="119" y="99" width="11" height="11" rx="2"/>
    <rect x="135" y="99" width="11" height="11" rx="2"/>
    <rect x="151" y="99" width="11" height="11" rx="2"/>
    <rect x="167" y="99" width="11" height="11" rx="2"/>
  </g>

  <path d="M262 82H298" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ak)"/>

  <text x="422" y="44" font-size="14" font-weight="700" fill="#8a4f22" text-anchor="middle">Student rollout</text>
  <g stroke="#c07a45" stroke-width="1.6" fill="#fbe9da">
    <rect x="305" y="60" width="46" height="42" rx="7"/>
    <rect x="357" y="60" width="46" height="42" rx="7"/>
    <rect x="409" y="60" width="46" height="42" rx="7"/>
    <rect x="493" y="60" width="46" height="42" rx="7"/>
  </g>
  <g font-size="14" font-style="italic" font-weight="600" fill="#8a4f22" text-anchor="middle">
    <text x="328" y="86">x̂<tspan font-size="10" dy="4">1</tspan></text>
    <text x="380" y="86">x̂<tspan font-size="10" dy="4">2</tspan></text>
    <text x="432" y="86">x̂<tspan font-size="10" dy="4">3</tspan></text>
    <text x="516" y="86">x̂<tspan font-size="10" dy="4">N</tspan></text>
  </g>
  <text x="474" y="86" font-size="16" fill="#8a4f22" text-anchor="middle">…</text>
  <text x="422" y="120" font-size="12" fill="#6b7280" text-anchor="middle">generated with online TTT memory</text>

  <rect x="600" y="46" width="266" height="70" rx="10" fill="#f6f7f9" stroke="#9aa2b1" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="733" y="74" font-size="13" font-weight="700" fill="#4b5563" text-anchor="middle">Initialization</text>
  <text x="733" y="94" font-size="12.5" fill="#6b7280" text-anchor="middle">consistency distillation, 50 → 4 steps</text>

  <!-- noise + split to the two score branches -->
  <path d="M422 128V150" stroke="#374151" stroke-width="1.8" fill="none"/>
  <path d="M230 150H670" stroke="#374151" stroke-width="1.8" fill="none"/>
  <path d="M230 150V182" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ak)"/>
  <path d="M670 150V182" stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#ak)"/>
  <rect x="372" y="138" width="100" height="22" rx="11" fill="#fff" stroke="#374151" stroke-width="1.4"/>
  <text x="422" y="153" font-size="12.5" fill="#374151" text-anchor="middle">add noise → <tspan font-style="italic">z</tspan><tspan font-size="9" dy="3" font-style="italic">t</tspan></text>

  <!-- ===== Row 2: two teacher / critic pairs ===== -->
  <rect x="30" y="186" width="400" height="132" rx="14" fill="#f1f5fa" stroke="#4f7394" stroke-width="1.8"/>
  <text x="230" y="210" font-size="15" font-weight="700" fill="#2c4a66" text-anchor="middle">Bidirectional Score</text>
  <rect x="50" y="222" width="168" height="50" rx="9" fill="#e3ecf5" stroke="#4f7394" stroke-width="1.6"/>
  <text x="134" y="243" font-size="14" font-weight="700" fill="#2c4a66" text-anchor="middle">Teacher</text>
  <text x="134" y="261" font-size="11.5" fill="#4f7394" text-anchor="middle">Stage 1 · frozen</text>
  <rect x="242" y="222" width="168" height="50" rx="9" fill="#fff" stroke="#4f7394" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="326" y="243" font-size="14" font-weight="700" fill="#2c4a66" text-anchor="middle">Critic</text>
  <text x="326" y="261" font-size="11.5" fill="#4f7394" text-anchor="middle">fit to student samples</text>
  <text x="230" y="300" font-size="12.5" fill="#4f7394" text-anchor="middle">short-range realism and motion coherence</text>

  <rect x="470" y="186" width="400" height="132" rx="14" fill="#eff5f0" stroke="#5b8a6a" stroke-width="1.8"/>
  <text x="670" y="210" font-size="15" font-weight="700" fill="#2f5a40" text-anchor="middle">Memory-Augmented AR Score</text>
  <rect x="490" y="222" width="168" height="50" rx="9" fill="#e9f1ea" stroke="#5b8a6a" stroke-width="1.6"/>
  <text x="574" y="243" font-size="14" font-weight="700" fill="#2f5a40" text-anchor="middle">Teacher</text>
  <text x="574" y="261" font-size="11.5" fill="#5b8a6a" text-anchor="middle">Stage 2 + TTT · frozen</text>
  <rect x="682" y="222" width="168" height="50" rx="9" fill="#fff" stroke="#5b8a6a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="766" y="243" font-size="14" font-weight="700" fill="#2f5a40" text-anchor="middle">Critic + TTT</text>
  <text x="766" y="261" font-size="11.5" fill="#5b8a6a" text-anchor="middle">fit to student samples</text>
  <text x="670" y="300" font-size="12.5" fill="#5b8a6a" text-anchor="middle">memory replayed over the rollout: long-horizon consistency</text>

  <!-- ===== Row 3: combined gradient ===== -->
  <path d="M230 320V344" stroke="#4f7394" stroke-width="1.8" fill="none" marker-end="url(#ak)"/>
  <path d="M670 320V344" stroke="#5b8a6a" stroke-width="1.8" fill="none" marker-end="url(#ak)"/>
  <rect x="180" y="348" width="540" height="40" rx="10" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.6"/>
  <text x="450" y="373" font-size="15" fill="#1f2937" text-anchor="middle">∇<tspan font-size="11" dy="4" font-style="italic">θ</tspan><tspan dy="-4"> 𝓛</tspan><tspan font-size="10" dy="4">DMD</tspan><tspan dy="-4">  =  ∇𝓛(</tspan><tspan fill="#2c4a66" font-weight="600">teacher, critic</tspan><tspan font-size="10" dy="4" fill="#4f7394">bidir</tspan><tspan dy="-4">)  +  ∇𝓛(</tspan><tspan fill="#2f5a40" font-weight="600">teacher, critic</tspan><tspan font-size="10" dy="4" fill="#5b8a6a">mem</tspan><tspan dy="-4">)</tspan></text>

  <!-- update back to the student -->
  <path d="M180 368H14V82H30" stroke="#c07a45" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ao)"/>
  <text x="0" y="0" font-size="12.5" font-weight="700" fill="#c07a45" text-anchor="middle" transform="translate(9 225) rotate(-90)">update θ</text>
</svg>
